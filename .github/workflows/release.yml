name: Release

# The container image is CI's job — it builds on every push to main and pushes a versioned
# tag when one appears, so an operator can always pull `latest`. This workflow is about the
# other half of a release: the packages a module author consumes, and the notes a human reads.
#
# Split that way on purpose. An image that only exists at release time would leave main
# unbuildable-in-practice between tags, and packages published on every push would flood the
# feed with versions nobody asked for.
on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The changelog step walks back to the previous tag, which a shallow clone lacks.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NexusSyncServer.sln

      - name: Build
        run: dotnet build NexusSyncServer.sln -c Release --no-restore

      - name: Test
        run: dotnet test NexusSyncServer.sln -c Release --no-build --verbosity normal

      # MinVer reads the tag, so no version is passed here and none is written in a csproj.
      # That is what makes tag and package version impossible to desynchronise.
      - name: Pack
        run: dotnet pack NexusSyncServer.sln -c Release --no-build -o ./artifacts

      - name: Push to GitHub Packages
        shell: pwsh
        run: |
          dotnet nuget add source `
            --username ${{ github.actor }} `
            --password ${{ secrets.GITHUB_TOKEN }} `
            --store-password-in-clear-text `
            --name github `
            "https://nuget.pkg.github.com/NexusFFXIV/index.json"
          Get-ChildItem ./artifacts/*.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --source github --skip-duplicate
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: ./artifacts/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: ./artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      # Folds the NexusKit and NexusKit.Modules changelogs into these notes, so one page
      # answers "what changed" for the whole stack. The server is an end product like the
      # plugin: whoever reads its release should not have to visit three repositories to
      # find out that the protocol moved underneath it.
      #
      # Advisory: a failure here costs annotation, not the release.
      - name: Expand internal dependency changelog
        continue-on-error: true
        uses: NexusFFXIV/.github/.github/actions/expand-internal-deps-changelog@main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
